<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Workout Tracker — v3</title>
<style>
  :root{
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;--r:11px;
    /* muscle categorical — fixed everywhere */
    --m-chest:#3987e5;--m-back:#d95926;--m-shoulders:#199e70;--m-arms:#c98500;--m-legs:#d55181;--m-core:#5aa832;
    /* status — reserved */
    --good:#0ca30c;--warn:#e0a017;--crit:#d03b3b;--under:#3a3a38;
    /* metric colors */
    --met-e1rm:var(--m-chest);--met-weight:var(--m-back);--met-reps:var(--m-shoulders);
  }
  :root[data-theme="dark"]{--bg:#0a0a0a;--card:#141413;--card2:#1e1e1c;--border:#272725;--border2:#33332f;--ink:#fafafa;--ink2:#a8a7a0;--muted:#6f6e69;--surf:#141413;--pri:#fafafa;--priink:#0a0a0a;--accent:#3987e5;}
  :root[data-theme="light"]{--bg:#f5f5f3;--card:#ffffff;--card2:#f2f2ef;--border:#e6e5e1;--border2:#dcdbd6;--ink:#0b0b0a;--ink2:#55544e;--muted:#8c8b85;--surf:#ffffff;--pri:#0b0b0a;--priink:#ffffff;--accent:#2a78d6;
    --m-chest:#2a78d6;--m-back:#eb6834;--m-shoulders:#1baf7a;--m-legs:#e87ba4;--m-core:#4e9a2a;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#000;font-family:var(--font);color:var(--ink);display:flex;justify-content:center;min-height:100vh;font-size:15px}
  .app{width:100%;max-width:420px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:470px){.app{margin:16px 0;height:880px;min-height:880px;border-radius:30px;box-shadow:0 0 0 9px #141413,0 20px 50px rgba(0,0,0,.6)}}
  header{padding:15px 15px 9px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:5}
  header .title{font-size:19px;font-weight:750;letter-spacing:-.02em}
  header .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .grow{flex:1}
  .icobtn{background:var(--card);border:1px solid var(--border);color:var(--ink);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
  .icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
  .body{flex:1;overflow-y:auto;padding:0 14px 108px;-webkit-overflow-scrolling:touch}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px}
  .card+.card{margin-top:9px}
  .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--ink2);border:1px solid var(--border)}
  .pill.xs{font-size:9.5px;padding:1px 6px}
  .pill.warnp{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:transparent}
  .pill.goodp{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:transparent}
  .mus{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
  .mus svg{width:22px;height:22px}
  .muted{color:var(--muted)}.ink2{color:var(--ink2)}
  .h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 3px 8px}
  .big{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .btn{border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:650;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%}
  .btn.primary{background:var(--pri);color:var(--priink)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border2)}
  .btn.sm{padding:8px 12px;font-size:12.5px;width:auto}
  .btn.txt{background:none;border:1px dashed var(--border2);color:var(--ink2)}
  .tabbar{position:absolute;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}
  .tab{flex:1;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
  .tab.active{color:var(--ink)}
  .num{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .num input{width:100%;background:none;border:none;color:var(--ink);font-size:16px;font-weight:700;font-family:var(--font);text-align:center;padding:10px 4px;outline:none;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num input:focus{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .num .u{font-size:10px;color:var(--muted);padding-right:9px;font-weight:600}
  .setrow{display:grid;grid-template-columns:20px 1fr 1fr 40px;gap:7px;align-items:center;margin-top:7px}
  .setrow .idx{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
  .setrow .chk{width:40px;height:40px;border-radius:8px;border:1px solid var(--border2);background:var(--card2);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .setrow .chk svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4}
  .setrow.done .chk{background:var(--good);border-color:var(--good);color:#fff}
  .setrow.done .num{opacity:.5}
  .colhead{display:grid;grid-template-columns:20px 1fr 1fr 40px;gap:7px;font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:3px;padding:0 1px}
  .colhead span{text-align:center}
  .rec{display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 10px;border-radius:8px;margin-top:2px;cursor:pointer;background:var(--card2);color:var(--ink2)}
  .rec b{color:var(--ink);font-weight:700}
  .dots{display:inline-flex;gap:3px;align-items:center}
  .dots i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted)}
  .dots i.g{background:var(--good)}.dots i.n{background:var(--ink2)}.dots i.r{background:var(--crit)}
  .pbar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
  .pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px}
  .kpi .k{font-size:10.5px;color:var(--muted);font-weight:600}
  .kpi .v{font-size:21px;font-weight:750;letter-spacing:-.02em;margin:3px 0 2px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:10.5px;font-weight:600}
  .up{color:var(--good)}.dn{color:var(--crit)}
  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
  .seg button{flex:1;border:none;background:none;color:var(--ink2);font-family:var(--font);font-size:11.5px;font-weight:650;padding:7px 3px;border-radius:7px;cursor:pointer}
  .seg button.active{background:var(--pri);color:var(--priink)}
  .seg.sm button{font-size:10.5px;padding:6px 2px}
  input[type=text],select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:15px;font-family:var(--font);outline:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}.chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--border);color:var(--ink2);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--pri);border-color:var(--pri);color:var(--priink)}
  .grouphd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:15px 3px 7px;display:flex;align-items:center;gap:7px}
  .grouphd .ln{flex:1;height:1px;background:var(--border)}
  .tgl{width:42px;height:25px;border-radius:99px;background:var(--card2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}
  .tgl.on{background:var(--good);border-color:var(--good)}
  .tgl::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:99px;background:#fff;transition:.15s}
  .tgl.on::after{left:19px}
  .divider{height:1px;background:var(--border);margin:11px 0}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}.sheet-bg.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:6px 16px calc(20px + env(safe-area-inset-bottom));z-index:31;transform:translateY(100%);transition:.22s;max-height:86%;overflow-y:auto}
  .sheet.open{transform:none}
  .grab{width:34px;height:4px;border-radius:99px;background:var(--border2);margin:7px auto 12px}
  .toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--good);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:650;opacity:0;transition:.2s;z-index:40;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%)}
  /* rest timer bar */
  .rest{position:absolute;left:12px;right:12px;bottom:80px;background:var(--pri);color:var(--priink);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:10px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .rest.show{display:flex}
  .rest .t{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;min-width:58px}
  .rest button{background:color-mix(in srgb,var(--priink) 14%,transparent);border:none;color:var(--priink);font-family:var(--font);font-weight:700;font-size:12.5px;padding:7px 10px;border-radius:7px;cursor:pointer}
  .glossitem{padding:9px 0;border-bottom:1px solid var(--border)}.glossitem b{color:var(--accent)}
  .recent{display:flex;gap:7px;overflow-x:auto;padding:3px 0}.recent::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icobtn" id="backBtn" style="display:none" onclick="goBack()"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div><div class="title" id="hTitle">Training</div><div class="sub" id="hSub"></div></div>
    <div class="grow"></div><div class="row" style="gap:8px" id="hAction"></div>
  </header>
  <div class="body" id="body"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="rest" id="rest"></div>
  <div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ===== original muscle-group glyphs (abstract, themeable) ===== */
const MUS={
  Chest:'<path d="M3 7c2.6-2.4 6-2.4 9 .4 3-2.8 6.4-2.8 9-.4v4.2c-2.4 3-6 3-9 .2-3 2.8-6.6 2.8-9-.2z" fill="currentColor" opacity=".9"/>',
  Back:'<path d="M12 3l7 4-3 12-4-3-4 3-3-12z" fill="currentColor" opacity=".9"/>',
  Shoulders:'<circle cx="7" cy="10" r="4.4" fill="currentColor" opacity=".9"/><circle cx="17" cy="10" r="4.4" fill="currentColor" opacity=".9"/>',
  Arms:'<path d="M5 6h5v4H8c-2 0-3 2-3 4s1 4 4 4h6v-4H9.5c-.4 0-.5-1 .5-1H14V6h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  Legs:'<path d="M7 3h4l-.5 8-1.5 10H8l-1-10zM17 3h-4l.5 8 1.5 10h1l1-10z" fill="currentColor" opacity=".9"/>',
  Core:'<g fill="currentColor" opacity=".9"><rect x="5" y="5" width="5.5" height="4" rx="1.2"/><rect x="13" y="5" width="5.5" height="4" rx="1.2"/><rect x="5" y="10" width="5.5" height="4" rx="1.2"/><rect x="13" y="10" width="5.5" height="4" rx="1.2"/><rect x="5" y="15" width="5.5" height="4" rx="1.2"/><rect x="13" y="15" width="5.5" height="4" rx="1.2"/></g>',
};
const MVAR={Chest:'--m-chest',Back:'--m-back',Shoulders:'--m-shoulders',Arms:'--m-arms',Legs:'--m-legs',Core:'--m-core'};
function musIcon(region){return `<div class="mus" style="background:color-mix(in srgb,var(${MVAR[region]}) 16%,transparent);color:var(${MVAR[region]})"><svg viewBox="0 0 24 24">${MUS[region]||MUS.Core}</svg></div>`;}
/* ===== data ===== */
const MODES={strength:{key:'strength',name:'Strength',low:3,high:5},hypertrophy:{key:'hypertrophy',name:'Hypertrophy',low:6,high:10},endurance:{key:'endurance',name:'Endurance',low:10,high:12}};
let settings={increment:2.5,trigger:'all_sets',rest:120,password:true,theme:'dark'};
const EX={
  bench:{name:'Bench Press',mov:'Bench Press',eq:'Barbell',mech:'Compound',region:'Chest',prim:['Chest'],sec:['Triceps','Front delts'],inc:2.5,lw:60,last:[10,10,10]},
  incline:{name:'Incline Bench Press',mov:'Incline Press',eq:'Barbell',mech:'Compound',region:'Chest',prim:['Upper chest'],sec:['Triceps'],inc:2.5,lw:60,last:[6,6,6],plateau:5},
  ohp:{name:'DB Shoulder Press',mov:'Shoulder Press',eq:'Dumbbell',mech:'Compound',region:'Shoulders',prim:['Front delts'],sec:['Triceps'],inc:2.5,lw:17.5,last:[8,7,6]},
  dips:{name:'Dips',mov:'Dips',eq:'Body only',mech:'Compound',region:'Chest',prim:['Lower chest'],sec:['Triceps'],inc:2.5,lw:60,last:[6,6,5],plateau:4},
  latpull:{name:'Lat Pulldown',mov:'Lat Pulldown',eq:'Cable',mech:'Compound',region:'Back',prim:['Lats'],sec:['Biceps'],inc:5,lw:65,last:[10,9,9]},
  row:{name:'Seated Cable Row',mov:'Row',eq:'Cable',mech:'Compound',region:'Back',prim:['Middle back'],sec:['Lats','Biceps'],inc:5,lw:55,last:[9,8,8]},
  facepull:{name:'Face Pull',mov:'Face Pull',eq:'Cable',mech:'Isolation',region:'Shoulders',prim:['Rear delts'],sec:[],inc:2.5,lw:57,last:[12,11,10]},
  tri:{name:'Triceps Pushdown',mov:'Pushdown',eq:'Cable',mech:'Isolation',region:'Arms',prim:['Triceps'],sec:[],inc:2.5,lw:75,last:[10,9,8]},
  curl:{name:'Hammer Curl',mov:'Curl',eq:'Dumbbell',mech:'Isolation',region:'Arms',prim:['Biceps'],sec:['Forearms'],inc:2,lw:14,last:[10,10,10]},
  frontsq:{name:'Front Squat',mov:'Front Squat',eq:'Barbell',mech:'Compound',region:'Legs',prim:['Quadriceps'],sec:['Glutes'],inc:2.5,lw:60,last:[8,7,6]},
  latraise:{name:'Lateral Raise',mov:'Lateral Raise',eq:'Cable',mech:'Isolation',region:'Shoulders',prim:['Side delts'],sec:[],inc:2.5,lw:10,last:[12,11,9]},
};
const WORKOUTS=[
  {id:'push',name:'Push',mode:'hypertrophy',last:'3 days ago',ex:[['bench',3],['ohp',3],['dips',3],['tri',3],['latraise',3]]},
  {id:'pull',name:'Pull',mode:'hypertrophy',last:'5 days ago',ex:[['latpull',3],['row',3],['facepull',3],['curl',3]]},
  {id:'legs',name:'Legs',mode:'hypertrophy',last:'9 days ago',ex:[['frontsq',4],['latpull',3]]},
  {id:'warm',name:'Warm-up',mode:'endurance',last:'yesterday',ex:[['facepull',2],['latraise',2],['curl',2]]},
];
const canon=e=>`${e.prim[0]} › ${e.mov} · ${e.eq}`;
/* engine */
function suggest(k,modeKey){const e=EX[k],m=MODES[modeKey],inc=e.inc||settings.increment;if(!e.last)return null;
  const allTop=settings.trigger==='all_sets'?e.last.every(r=>r>=m.high):e.last[e.last.length-1]>=m.high;
  if(allTop)return{type:'up',weight:+(e.lw+inc).toFixed(2),why:`All sets reached ${m.high} last time`};
  return{type:'hold',weight:e.lw,why:`Last time ${e.last.join('/')} — build reps to ${m.high}`};}
const e1rm=(w,r)=>w*(1+r/30),fmt=n=>(Math.round(n*10)/10).toString();
const setDots=(last,m)=>last.map(r=>r>=m.high?'g':r>=m.low?'n':'r');
/* ===== router ===== */
let screen='training',activeWO=null,backStack=[];
const TABS=[
  {id:'training',label:'Training',icon:'<rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 6v12M17 6v12"/>'},
  {id:'exercises',label:'Exercises',icon:'<circle cx="12" cy="7" r="3.2"/><path d="M5 21c0-3.5 3.2-5.5 7-5.5s7 2 7 5.5"/>'},
  {id:'analysis',label:'Analysis',icon:'<path d="M4 19V5M4 19h16M8 14l3-3 3 2 4-5"/>'},
  {id:'settings',label:'Settings',icon:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'},
];
const HEAD={training:['Training','Thursday · Aug 13'],exercises:['Exercises','Library · Free Exercise DB'],analysis:['Analysis','Your progress'],settings:['Settings','App & training']};
function nav(s,push){if(push&&screen!==s)backStack.push(screen);screen=s;render();}
function goBack(){screen=backStack.pop()||'training';if(screen!=='track')activeWO=null;render();}
function setTheme(t){settings.theme=t;document.documentElement.setAttribute('data-theme',t);render();}
function render(){
  const inFlow=['track','woedit'].includes(screen);
  document.getElementById('tabbar').style.display=inFlow?'none':'flex';
  document.getElementById('backBtn').style.display=inFlow?'grid':'none';
  let act=`<button class="icobtn" onclick="setTheme('${settings.theme==='dark'?'light':'dark'}')" title="theme">${settings.theme==='dark'?'<svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>':'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>'}</button>`;
  if(screen==='analysis')act+=`<button class="icobtn" onclick="glossary()"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8v0"/></svg></button>`;
  document.getElementById('hAction').innerHTML=inFlow?'':act;
  if(HEAD[screen]){document.getElementById('hTitle').textContent=HEAD[screen][0];document.getElementById('hSub').textContent=HEAD[screen][1];}
  document.getElementById('body').innerHTML=({training:vTraining,exercises:vExercises,analysis:vAnalysis,settings:vSettings,track:vTrack,woedit:vWoEdit}[screen])();
  document.getElementById('body').scrollTop=inFlow?document.getElementById('body').scrollTop:0;
  document.getElementById('tabbar').innerHTML=TABS.map(t=>`<button class="tab ${screen===t.id?'active':''}" onclick="nav('${t.id}')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>${t.label}</button>`).join('');
  if(screen==='exercises')renderExList();
}
/* ===== training ===== */
function vTraining(){
  return `<div class="card" style="overflow:hidden;padding:0"><div style="padding:14px 14px 12px">
      <div class="muted" style="font-size:10.5px;font-weight:600;letter-spacing:.05em">SUGGESTED TODAY</div>
      <div class="row between" style="margin-top:4px"><div class="big" style="font-size:17px">Push</div>${heroFig()}</div>
      <div class="ink2" style="font-size:12px;margin-top:-16px">Last 3 days ago · Hypertrophy · 5 exercises</div>
      <div style="margin-top:11px"><button class="btn primary" onclick="startWO('push')">Start workout</button></div></div></div>
    <div class="h2">Your workouts</div>
    ${WORKOUTS.map(w=>{const m=MODES[w.mode];const plat=w.ex.some(([k])=>EX[k].plateau);return `<div class="card"><div class="row">
      ${musIcon(EX[w.ex[0][0]].region)}
      <div style="flex:1;min-width:0"><div class="row" style="gap:6px"><span class="big">${w.name}</span><span class="pill mode xs">${m.name} ${m.low}–${m.high}</span>${plat?'<span class="pill warnp xs">plateau</span>':''}</div>
        <div class="muted" style="font-size:11.5px;margin-top:3px">${w.ex.length} exercises · last ${w.last}</div></div>
      <button class="btn primary sm" onclick="startWO('${w.id}')">Start</button></div></div>`;}).join('')}
    <div style="margin-top:12px"><button class="btn txt" onclick="nav('woedit',true)">+ New workout</button></div>`;
}
function heroFig(){return `<svg viewBox="0 0 90 60" style="width:90px;height:60px;flex-shrink:0"><g fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".85">

function kpi(k,v,u,d,dc,s,col){return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}<span style="font-size:11px;color:var(--muted)">${u}</span></div><div class="d ${dc}">${d}</div><div style="margin-top:7px">${spark(s,110,26,`var(${col})`)}</div></div>`;}
function spark(d,w,h,c){const mn=Math.min(...d),mx=Math.max(...d),pd=3,X=i=>pd+i*(w-2*pd)/(d.length-1),Y=v=>h-pd-(mx===mn?.5:(v-mn)/(mx-mn))*(h-2*pd);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="width:${w}px"><path d="${d.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(d.length-1)}" cy="${Y(d[d.length-1])}" r="2.6" fill="${c}"/></svg>`;}
function trend3(){const e1=[50,55,58,62,66,68,71,74,75,78,81],wt=[50,55,57.5,60,60,62.5,65,67.5,70,72.5,75],rp=[8,6,8,8,10,7,8,8,9,8,6],w=340,h=140,pd=8,n=e1.length,X=i=>pd+i*(w-2*pd)/(n-1),Yk=v=>h-pd-(v-45)/40*(h-2*pd),Yr=v=>h-pd-(v-4)/8*(h-2*pd),P=(a,Y)=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><path d="${P(wt,Yk)}" fill="none" stroke="var(--met-weight)" stroke-width="2" stroke-linecap="round"/><path d="${P(rp,Yr)}" fill="none" stroke="var(--met-reps)" stroke-width="2" stroke-linecap="round"/><path d="${P(e1,Yk)}" fill="none" stroke="var(--met-e1rm)" stroke-width="2.4" stroke-linecap="round"/><circle cx="${X(n-1)}" cy="${Yk(81)}" r="4" fill="var(--met-e1rm)" stroke="var(--surf)" stroke-width="2"/></svg>`;}
function radar(sig){const ax=['Chest','Back','Shoulders','Arms','Legs','Core'],val=sig?[.95,.1,.7,.6,.05,.3]:[.9,.83,.8,.78,.34,.55];
  const cx=125,cy=115,R=82,n=6,pt=(i,r)=>[cx+Math.sin(i/n*2*Math.PI)*r,cy-Math.cos(i/n*2*Math.PI)*r];
  let rings='';[.33,.66,1].forEach(f=>rings+=`<polygon points="${ax.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--border)" stroke-width="1"/>`);
  const poly=ax.map((_,i)=>pt(i,R*val[i]).join(',')).join(' ');
  const lab=ax.map((a,i)=>{const[x,y]=pt(i,R+15);return `<text x="${x}" y="${y}" fill="var(--muted)" font-size="10.5" font-family="var(--font)" text-anchor="middle" dominant-baseline="middle">${a}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 250 230" style="max-width:270px;margin:0 auto">${rings}<polygon points="${poly}" fill="var(--accent)" fill-opacity="0.14" stroke="var(--accent)" stroke-width="2"/>${lab}</svg>`;}
function stacked(){const cols=['Chest','Shoulders','Arms'],vars=['--m-chest','--m-shoulders','--m-arms'],data=[[6,6,3],[6,5,3],[7,6,4],[6,6,3],[7,6,4],[6,6,3]],w=330,h=130,pd=14,bw=20,mxT=Math.max(...data.map(d=>d.reduce((a,b)=>a+b)))*1.1,Y=v=>h-pd-v/mxT*(h-2*pd);
  let s='';data.forEach((d,k)=>{const x=pd+k*((w-2*pd)/data.length)+((w-2*pd)/data.length-bw)/2;let acc=0;d.forEach((v,ci)=>{const y0=Y(acc),y1=Y(acc+v);acc+=v;s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-2)}" fill="var(${vars[ci]})"/>`;});s+=`<text x="${x+bw/2}" y="${h-3}" fill="var(--muted)" font-size="9" text-anchor="middle">S${k+1}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${s}</svg>`;}
function decouple(){const st=[50,58,64,70,75,81],mu=[36.8,37.1,38.2,38.6,38.6,38.6],w=330,h=100,pd=6,X=i=>pd+i*(w-2*pd)/5,Ys=v=>h-pd-(v-45)/40*(h-2*pd),Ym=v=>h-pd-(v-36)/4*(h-2*pd),P=(a,Y)=>a.map((v,i)=>`${i?'L':'M'}${X(i)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><path d="${P(st,Ys)}" fill="none" stroke="var(--met-e1rm)" stroke-width="2.2" stroke-linecap="round"/><path d="${P(mu,Ym)}" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round"/></svg>`;}
function bodyHeat(){const R={chest:'good',sh:'good',bi:'good',abs:'warn',quad:'under',fore:'under',lat:'good',tri:'warn',glut:'under',ham:'under',calf:'under'},c=s=>({good:'var(--good)',warn:'var(--warn)',crit:'var(--crit)',under:'var(--under)'}[s]);
  const fig=(bk)=>`<svg class="chart" viewBox="0 0 90 180" style="height:170px;width:auto"><g stroke="var(--surf)" stroke-width="1.1">
    <ellipse cx="45" cy="12" rx="8" ry="9" fill="var(--under)"/>
    ${bk?`<path d="M31 28h28v26l-14 6-14-6z" fill="${c(R.lat)}"/><rect x="18" y="39" width="8" height="22" rx="4" fill="${c(R.tri)}"/><rect x="64" y="39" width="8" height="22" rx="4" fill="${c(R.tri)}"/><rect x="33" y="62" width="24" height="15" rx="4" fill="${c(R.glut)}"/><path d="M32 78h26v34h-11v-24h-4v24h-11z" fill="${c(R.ham)}"/>`
      :`<path d="M29 28h32v9h-32z" fill="${c(R.chest)}"/><ellipse cx="25" cy="32" rx="7" ry="8" fill="${c(R.sh)}"/><ellipse cx="65" cy="32" rx="7" ry="8" fill="${c(R.sh)}"/><rect x="34" y="39" width="22" height="15" rx="3" fill="${c(R.abs)}"/><rect x="18" y="39" width="8" height="22" rx="4" fill="${c(R.bi)}"/><rect x="64" y="39" width="8" height="22" rx="4" fill="${c(R.bi)}"/><path d="M31 56h28v36h-12v-25h-4v25h-12z" fill="${c(R.quad)}"/>`}
    <rect x="35" y="128" width="8" height="20" rx="4" fill="${c(R.calf)}"/><rect x="47" y="128" width="8" height="20" rx="4" fill="${c(R.calf)}"/></g></svg>`;
  return `<div style="display:flex;gap:6px;justify-content:center">${fig(0)}${fig(1)}</div>`;}
function fitGauge(){const val=90,w=230,h=140,cx=115,cy=112,R=82,a0=-215,a1=35,rad=d=>d*Math.PI/180,pol=(deg,r)=>[cx+Math.cos(rad(deg))*r,cy+Math.sin(rad(deg))*r],arc=(f,t,r)=>{const[x0,y0]=pol(f,r),[x1,y1]=pol(t,r),lg=(t-f)>180?1:0;return `M${x0} ${y0} A${r} ${r} 0 ${lg} 1 ${x1} ${y1}`;},vA=a0+(a1-a0)*val/100;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="max-width:240px;margin:0 auto"><path d="${arc(a0,a1,R)}" fill="none" stroke="var(--card2)" stroke-width="12" stroke-linecap="round"/><path d="${arc(a0,vA,R)}" fill="none" stroke="var(--good)" stroke-width="12" stroke-linecap="round"/><text x="${cx}" y="${cy-4}" fill="var(--ink)" font-size="40" font-weight="750" text-anchor="middle" font-family="var(--font)">${val}</text><text x="${cx}" y="${cy+15}" fill="var(--muted)" font-size="11" text-anchor="middle" font-family="var(--font)">FitScore · ▲ +3</text></svg>`;}
function calendar(){const cols=18,vals=[2,3,3,2,3,3,3,1,1,3,3,2,3,3,2,3,3,3];let c='';for(let d=0;d<7;d++)for(let wk=0;wk<cols;wk++){const on=(d+wk)%3!==0&&vals[wk]>0,v=on?vals[wk]:0,a=v===0?0:0.3+v*0.23;c+=`<rect x="${wk*17}" y="${d*17}" width="14" height="14" rx="3" fill="var(--accent)" fill-opacity="${v===0?0:a}" ${v===0?'stroke="var(--border)" stroke-width="0.8"':''}/>`;}
  return `<svg class="chart" viewBox="0 0 ${cols*17} 119" style="max-width:${cols*17}px">${c}</svg>`;}
/* glossary + settings + sheet/toast */
const GLOSS={'e1RM':'Estimated 1-rep max — predicted max single lift from weight × reps (Epley). Track strength without testing a true 1RM.','MEV':'Minimum Effective Volume — least weekly sets a muscle needs to grow.','MAV':'Maximum Adaptive Volume — sweet spot of weekly sets for fastest growth.','MRV':'Maximum Recoverable Volume — most you can recover from.','ACWR':'Acute:Chronic Workload Ratio — this week vs 4-week average. 0.8–1.3 safe; spikes raise injury risk.','Plateau':'No e1RM gain over several sessions — a signal to deload or vary the exercise.'};
function glossary(){openSheet(`<div class="grab"></div><div class="big" style="font-size:17px;margin-bottom:6px">Glossary</div>${Object.entries(GLOSS).map(([k,v])=>`<div class="glossitem"><b>${k}</b><div class="ink2" style="font-size:12.5px;margin-top:3px;line-height:1.45">${v}</div></div>`).join('')}<div style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);}
function glossTerm(k){openSheet(`<div class="grab"></div><div class="big" style="font-size:17px">${k}</div><div class="ink2" style="font-size:13px;margin-top:8px;line-height:1.5">${GLOSS[k]}</div><div style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);}
function vSettings(){return `<div class="h2" style="margin-top:6px">Appearance</div>
  <div class="card"><div class="row between"><span class="ink2" style="font-size:13px">Theme</span><div class="seg" style="width:150px"><button class="${settings.theme==='dark'?'active':''}" onclick="setTheme('dark')">Dark</button><button class="${settings.theme==='light'?'active':''}" onclick="setTheme('light')">Light</button></div></div>
    <div class="muted" style="font-size:11px;margin-top:7px">Dark spart im Gym OLED-Strom. Farbe gehört den Daten.</div></div>
  <div class="h2">Training modes &amp; rep ranges</div>
  ${Object.values(MODES).map(m=>`<div class="card" style="padding:11px"><div class="row between"><div class="big" style="font-size:14px">${m.name}</div>
    <div class="row" style="gap:6px"><div class="num" style="width:56px"><input type="number" inputmode="numeric" value="${m.low}" onchange="MODES['${m.key}'].low=+this.value"></div><span class="muted">–</span><div class="num" style="width:56px"><input type="number" inputmode="numeric" value="${m.high}" onchange="MODES['${m.key}'].high=+this.value"></div></div></div></div>`).join('')}
  <div class="h2">Progression &amp; rest</div>
  <div class="card"><div class="row between"><div style="flex:1"><div class="big" style="font-size:14px">Default increment</div></div><div class="num" style="width:84px"><input type="number" inputmode="decimal" step="0.5" value="${fmt(settings.increment)}" onchange="settings.increment=+this.value"><span class="u">kg</span></div></div>
    <div class="divider"></div>
    <div><div class="big" style="font-size:14px">Increase weight when</div><div class="seg" style="margin-top:8px"><button class="${settings.trigger==='all_sets'?'active':''}" onclick="settings.trigger='all_sets';render()">all sets hit top</button><button class="${settings.trigger==='last_set'?'active':''}" onclick="settings.trigger='last_set';render()">last set hits top</button></div>
      <div class="muted" style="font-size:11px;margin-top:6px">${settings.trigger==='all_sets'?'Konservativ: erst wenn alle Arbeitssätze das obere Rep-Ende schaffen.':'Aggressiver: schon wenn der letzte (schwerste) Satz oben ist.'}</div></div>
    <div class="divider"></div>
    <div class="row between"><div style="flex:1"><div class="big" style="font-size:14px">Rest timer</div><div class="muted" style="font-size:11px;margin-top:2px">startet nach „Satz erledigt"</div></div><div class="num" style="width:96px"><input type="number" inputmode="numeric" step="15" value="${settings.rest}" onchange="settings.rest=+this.value"><span class="u">sec</span></div></div></div>
  <div class="h2">General</div>
  <div class="card"><div class="row between"><span class="ink2" style="font-size:13px">Units</span><span class="pill">Metric · kg / cm</span></div><div class="divider"></div>
    <div class="row between"><div style="flex:1"><span class="ink2" style="font-size:13px">Password lock</span><div class="muted" style="font-size:11px;margin-top:2px">one login for the whole app</div></div><div class="tgl ${settings.password?'on':''}" onclick="settings.password=!settings.password;render()"></div></div></div>
  <div class="card" style="margin-top:9px;text-align:center"><div class="muted" style="font-size:11px">BIA &amp; HR import · PDF/CSV export · Sync — later stages</div></div>`;}
function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('sheetBg').classList.add('open');document.getElementById('sheet').classList.add('open');}
function closeSheet(){document.getElementById('sheetBg').classList.remove('open');document.getElementById('sheet').classList.remove('open');}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}
render();
</script>
